<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" fill="none">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#bcdcfb"/>
      <stop offset="1" stop-color="#9ccaf5"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e4f1fd"/>
      <stop offset="1" stop-color="#c9e2f9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 300) scale(300 190)">
      <stop stop-color="#7fb8f2" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7fb8f2" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>
  <rect width="960" height="540" fill="#171e30"/>
  <rect width="960" height="540" fill="none"/>

  <!-- soft shadow -->
  <ellipse cx="480" cy="424" rx="150" ry="14" fill="#0a0f1c" opacity="0.7" filter="url(#blur)"/>

  <!-- back panel -->
  <rect x="315" y="118" width="330" height="140" rx="20" fill="#a9d1f7"/>

  <!-- paper card -->
  <rect x="340" y="140" width="280" height="90" rx="12" fill="#f5faff"/>
  <rect x="362" y="158" width="130" height="9" rx="4.5" fill="#d5dfec"/>
  <rect x="362" y="182" width="260" height="3" fill="#e2eaf4"/>

  <!-- front pocket -->
  <rect x="300" y="200" width="360" height="214" rx="26" fill="#d6e9fb"/>
  <rect x="300" y="200" width="360" height="214" rx="26" stroke="#ffffff" stroke-opacity="0.55" stroke-width="2"/>

  <!-- cloud -->
  <path d="M452 322a16 16 0 0 1-2-32a24 24 0 0 1 46-8a19 19 0 0 1 8 40z" stroke="#4c9be8" stroke-width="5" stroke-linejoin="round" fill="#8cc2f4"/>

  <!-- bottom lines -->
  <rect x="340" y="378" width="280" height="3" fill="#b9d6f1"/>
  <rect x="340" y="390" width="280" height="3" fill="#cfe3f6"/>
</svg>
